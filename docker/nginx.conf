user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /dev/stdout;
    sendfile      on;
    keepalive_timeout 65;

    # Inbound webhooks carry base64 attachments; the default 1m is too small.
    client_max_body_size 25m;

    # Railway terminates TLS at the edge, so trust its forwarded scheme.
    map $http_x_forwarded_proto $forwarded_scheme {
        default $scheme;
        https   https;
    }

    server {
        listen ${PORT};
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS $forwarded_scheme;
            fastcgi_read_timeout 60s;
        }

        # Never serve dotfiles (.env, .git) even if they land in the web root.
        location ~ /\.(?!well-known).* { deny all; }
    }
}
