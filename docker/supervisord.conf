[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Without this, inbound mail is accepted by the webhook and never processed.
; --max-time recycles the worker hourly so a leaked connection or stale
; config can't wedge ingestion indefinitely; supervisor restarts it.
[program:queue-worker]
command=php /var/www/html/artisan queue:work --tries=3 --sleep=1 --max-time=3600 --rest=0.2
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=30
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
